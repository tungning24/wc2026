<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 10px;
    color:#111827;
}

.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

#schedule.knockout-mode{
    display:block;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

.knockout-date{
    background:#4c5563;
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    font-weight:bold;
}

.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

.tv-icon{
    width:14px;
    height:14px;
    margin-left:4px;
    vertical-align:middle;
}

@media(min-width:600px){
    #schedule{ grid-template-columns:1fr 1fr; }
}
@media(min-width:1000px){
    #schedule{ grid-template-columns:1fr 1fr 1fr; }
}
.card table{
    width:100%;
    border-collapse:collapse;
    margin:0;
}

.card th{
    background:#4c5563;
    color:#fff;
    padding:10px 6px;
    border:0;
}

.card td{
    padding:6px 4px;
    text-align:center;
}

.card td:first-child{
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card td img{
    width:18px;
    height:12px;
    vertical-align:middle;
    margin-right:6px;
}
.standings-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}

.standings-table th,
.standings-table td{
  text-align:center;
  padding:6px 4px;
}

.team-cell{
  text-align:left;
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ================= BRACKET ================= */
.bracket-wrap{
    width:100%;
    overflow-x:auto;
    padding-bottom:12px;
}

.bracket{
    position:relative;
    width:1180px;
    min-width:1180px;
    height:1580px;
    margin:0 auto;
}

.round-title{
    position:absolute;
    top:0;
    width:180px;
    text-align:center;
    color:#4b5563;
    font-size:13px;
    font-weight:bold;
}

.ko-match{
    position:absolute;
    width:180px;
    min-height:80px;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    z-index:2;
}

.ko-match-header{
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    font-size:12px;
    font-weight:bold;
}

.ko-team{
    display:grid;
    grid-template-columns:22px 1fr 34px;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-bottom:1px solid #eee;
}

.ko-team:last-child{
    border-bottom:none;
}

.ko-score{
    color:#111827;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.bracket svg{
    position:absolute;
    inset:0;
    width:1180px;
    height:1580px;
    pointer-events:none;
    z-index:1;
}

.bracket line{
    stroke:#b0b0b0;
    stroke-width:1.5;
}

.status{
    text-align:center;
    color:#6b7280;
    font-size:13px;
    padding:20px;
}

@media(max-width:700px){
    .bracket{
        margin:0;
    }
}
/* ================= DARK MODE ================= */
.header-bar{
    position:relative;
    margin-bottom:12px;
}

.header-bar h1{
    text-align:center;
}
.theme-toggle{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);

    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    background:#111827;
    color:#fff;
}

/* Dark Theme */

body.dark{
    background:#0f172a;
    color:#e5e7eb;
}

body.dark h1{
    color:#fff;
}

body.dark .tab{
    background:#1e293b;
    color:#cbd5e1;
}

body.dark .tab.active{
    background:#2563eb;
    color:#fff;
}

body.dark .card{
    background:#1e293b;
    box-shadow:none;
	border:1px solid #334155;
}

body.dark .card-header{
    background:#121F3E;
}

body.dark .knockout-date{
    background:#334155;
}

body.dark .match{
    border-bottom:1px solid #334155;
}

body.dark .score{
    color:#fff;
}

body.dark .top-row{
    color:#94a3b8;
}

body.dark .team-name{
    color:#e5e7eb;
}

body.dark .card th{
    background:#334155;
}

body.dark .card td{
    color:#e5e7eb;
}

body.dark .flag{
    border-color:#475569;
}

body.dark .theme-toggle{
    background:#f8fafc;
    color:#111827;
}

body.dark .round-title{
    color:#cbd5e1;
}

body.dark .ko-match{
    background:#1e293b;
    box-shadow:none;
    border:1px solid #334155;
}

body.dark .ko-match-header{
    background:#121F3E;
}

body.dark .ko-team{
    border-bottom:1px solid #334155;
}

body.dark .ko-score{
    color:#fff;
}

body.dark .bracket line{
    stroke:#475569;
}

body.dark .status{
    color:#94a3b8;
}
</style>
</head>

<body>
<div class="header-bar">
<h1>FIFA WORLD CUP 2026</h1>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
<div class="tabs">
    <div class="tab active" onclick="switchTab('group', event)">Group Stage</div>
    <div class="tab" onclick="switchTab('standings', event)">Standings</div>
    <div class="tab" onclick="switchTab('knockout', event)">Knockout</div>
    <div class="tab" onclick="switchTab('bracket', event)">Bracket</div>
</div>

<div id="schedule"></div>
<script>
const themeBtn = document.getElementById("themeToggle");

function applyTheme(theme){
    document.body.classList.toggle("dark", theme==="dark");
    themeBtn.textContent = theme==="dark" ? "☀️" : "🌙";
}

const savedTheme = localStorage.getItem("theme") || "light";
applyTheme(savedTheme);

themeBtn.addEventListener("click", () => {

    const newTheme =
        document.body.classList.contains("dark")
        ? "light"
        : "dark";

    applyTheme(newTheme);
    localStorage.setItem("theme", newTheme);
});
</script>

<script src="main.js"></script>

</body>
</html>
