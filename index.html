<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0;
    color:#111827;
}

/* TABS */
.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    padding:8px 12px;
    background:#e5e7eb;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* MATCH */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.home,.away{
    display:flex;
    align-items:center;
    gap:6px;
}

.away{justify-content:flex-end;}

.team-name{
    font-size:13px;
}

.score{
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" onclick="loadGroup()">Group Stage</div>
    <div class="tab" onclick="loadKnockout()">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX",
  "South Africa":"RSA",
  "South Korea":"KOR",
  "Czechia":"CZE",
  "Canada":"CAN",
  "USA":"USA",
  "Brazil":"BRA",
  "Argentina":"ARG",
  "England":"ENG"
};

/* ================= GROUP STAGE ================= */
function loadGroup(){

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab')[0].classList.add('active');

fetch(`matches.json?v=${Date.now()}`)
.then(r=>r.json())
.then(renderGroup);
}

function renderGroup(data){

const container=document.getElementById("schedule");
container.innerHTML="";

data.forEach(day=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="card-header">${day.date}</div>

${day.matches.map(m=>{

m.homeScore ??="-";
m.awayScore ??="-";
m.homeFlag ??=flagMap[m.home];
m.awayFlag ??=flagMap[m.away];

const score=(m.homeScore==="-"&&m.awayScore==="-" )
?"-"
:`${m.homeScore} - ${m.awayScore}`;

return `
<div class="match">
  <div class="top-row">
    <div>${m.group||""}</div>
    <div>${m.time}</div>
  </div>

  <div class="teams">
    <div class="home">
      <img src="flags/${m.homeFlag}.jpg" width="22">
      <div class="team-name">${m.home}</div>
    </div>

    <div class="score">${score}</div>

    <div class="away">
      <div class="team-name">${m.away}</div>
      <img src="flags/${m.awayFlag}.jpg" width="22">
    </div>
  </div>
</div>
`;
}).join("")}
`;

container.appendChild(card);
});
}

/* ================= KNOCKOUT ================= */
function loadKnockout(){

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab')[1].classList.add('active');

fetch(`knockout.json?v=${Date.now()}`)
.then(r=>r.json())
.then(renderKnockout);
}

/* flatten → group by date → same UI as group stage */
function renderKnockout(data){

const container=document.getElementById("schedule");
container.innerHTML="";

let flat=[];

data.forEach(r=>{
    r.days.forEach(d=>{
        d.matches.forEach(m=>{
            flat.push({
                date:d.date,
                round:r.round,
                ...m
            });
        });
    });
});

let grouped={};

flat.forEach(m=>{
    if(!grouped[m.date]) grouped[m.date]=[];
    grouped[m.date].push(m);
});

Object.keys(grouped).forEach(date=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="card-header">${date}</div>

${grouped[date].map(m=>{

m.homeScore ??="-";
m.awayScore ??="-";

const score=(m.homeScore==="-"&&m.awayScore==="-" )
?"-"
:`${m.homeScore} - ${m.awayScore}`;

return `
<div class="match">

  <div class="top-row">
    <div>${m.round}</div>
    <div>${m.time}</div>
  </div>

  <div class="teams">

    <div class="home">
      <div class="team-name">${m.home}</div>
    </div>

    <div class="score">${score}</div>

    <div class="away">
      <div class="team-name">${m.away}</div>
    </div>

  </div>

</div>
`;
}).join("")}
`;

container.appendChild(card);

});

}

/* init */
loadGroup();
</script>

</body>
</html>
