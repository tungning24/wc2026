<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA WORLD CUP 2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:12px;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0;
}

/* TABS */
.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* DATE HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* KNOCKOUT DATE HEADER */
.knock-date{
    background:linear-gradient(90deg,#111827,#374151);
}

/* MATCH */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{border-bottom:none;}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.home,.away{
    display:flex;
    gap:6px;
    align-items:center;
}

.home{justify-content:flex-start;}
.away{justify-content:flex-end;}

.team-name{font-size:13px;}

.score{
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab('group')">Group</div>
    <div class="tab" onclick="switchTab('knockout')">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap={
 "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
 "Canada":"CAN","USA":"USA","Brazil":"BRA","Argentina":"ARG","France":"FRA"
};

let groupData=[], knockoutData=[];
let tab="group";

/* LOAD DATA */
fetch("matches.json").then(r=>r.json()).then(d=>{
    groupData=d;
    if(tab==="group") renderGroup();
});

fetch("knockout.json").then(r=>r.json()).then(d=>{
    knockoutData=d;
});

/* TAB SWITCH */
function switchTab(t){
    tab=t;
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    event.target.classList.add("active");

    if(t==="group") renderGroup();
    else renderKnockout();
}

/* CARD */
function createCard(date, matches, isKnock=false){
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
        <div class="card-header ${isKnock?'knock-date':''}">
            ${date}
        </div>

        ${matches.map(m=>{
            const score=(m.homeScore==null||m.awayScore==null)
                ? "-"
                : `${m.homeScore}-${m.awayScore}`;

            return `
            <div class="match">
                <div class="top-row">
                    <div>${m.group||m.round||""}</div>
                    <div>${m.time||""}</div>
                </div>

                <div class="teams">
                    <div class="home">
                        <span class="team-name">${m.home}</span>
                    </div>

                    <div class="score">${score}</div>

                    <div class="away">
                        <span class="team-name">${m.away}</span>
                    </div>
                </div>
            </div>`;
        }).join("")}
    `;

    return card;
}

/* GROUP */
function renderGroup(){
    const c=document.getElementById("schedule");
    c.innerHTML="";
    groupData.forEach(d=>{
        c.appendChild(createCard(d.date,d.matches,false));
    });
}

/* KNOCKOUT */
function renderKnockout(){
    const c=document.getElementById("schedule");
    c.innerHTML="";

    knockoutData.forEach(r=>{
        r.days.forEach(day=>{
            c.appendChild(
                createCard(day.date,day.matches.map(m=>({...m,round:r.round})),true)
            );
        });
    });
}
</script>

</body>
</html>
