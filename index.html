<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 10px;
    color:#111827;
}

/* TAB */
.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* MAIN GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* DATE HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* 🔥 NEW: knockout date separator */
.knockout-date{
    background:#374151;
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    font-weight:bold;
}

/* MATCH */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

/* TEAMS */
.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

@media(min-width:600px){
    #schedule{ grid-template-columns:1fr 1fr; }
}
@media(min-width:1000px){
    #schedule{ grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>

<body>
<script>

if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('./sw.js')
      .then(() => console.log('SW Registered'))
      .catch(err => console.log(err));

  });

}

</script>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab('group')">Group Stage</div>
    <div class="tab" onclick="switchTab('knockout')">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX",
  "South Africa":"RSA",
  "South Korea":"KOR",
  "Czechia":"CZE",
  "Canada":"CAN",
  "Bosnia & Herz.":"BIH",
  "Bosnia":"BIH",
  "USA":"USA",
  "Paraguay":"PAR",
  "Qatar":"QAT",
  "Switzerland":"SUI",
  "Brazil":"BRA",
  "Morocco":"MAR",
  "Haiti":"HAI",
  "Scotland":"SCO",
  "Australia":"AUS",
  "Turkiye":"TUR",
  "Germany":"GER",
  "Curacao":"CUW",
  "Netherlands":"NED",
  "Japan":"JPN",
  "Ivory Coast":"CIV",
  "Ecuador":"ECU",
  "Sweden":"SWE",
  "Tunisia":"TUN",
  "Spain":"ESP",
  "Cape Verde":"CPV",
  "Belgium":"BEL",
  "Egypt":"EGY",
  "Saudi Arabia":"KSA",
  "Uruguay":"URU",
  "Iran":"IRN",
  "New Zealand":"NZL",
  "France":"FRA",
  "Senegal":"SEN",
  "Iraq":"IRQ",
  "Norway":"NOR",
  "Argentina":"ARG",
  "Algeria":"ALG",
  "Austria":"AUT",
  "Jordan":"JOR",
  "Portugal":"POR",
  "Congo DR":"COD",
  "England":"ENG",
  "Croatia":"CRO",
  "Ghana":"GHA",
  "Panama":"PAN",
  "Uzbekistan":"UZB",
  "Colombia":"COL"
};

let groupData = [];
let knockoutData = [];
let currentTab = "group";

fetch("matches.json?v=" + Date.now())
.then(r => r.json())
.then(data => {
    groupData = data;
    if(currentTab === "group") render(groupData);
});

fetch("knockout.json?v=" + Date.now())
.then(r => r.json())
.then(data => {
    knockoutData = data;
});

function switchTab(tab){

    currentTab = tab;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");

    if(tab === "group") render(groupData);
    else renderKnockout(knockoutData);
}

/* ===== GROUP (เดิม 100%) ===== */
function render(data){

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(day => {

        const card = document.createElement("div");
        card.className = "card";

        day.matches.forEach(m=>{
            m.homeFlag ??= flagMap[m.home];
            m.awayFlag ??= flagMap[m.away];
            m.homeScore ??= "-";
            m.awayScore ??= "-";
        });

        card.innerHTML = `
            <div class="card-header">${day.date}</div>

            ${day.matches.map(match => {

                const scoreText =
                    (match.homeScore === "-" && match.awayScore === "-")
                    ? "-"
                    : `${match.homeScore} - ${match.awayScore}`;

                return `
                <div class="match">
                    <div class="top-row">
                        <div>${match.group}</div>
                        <div>${match.time}</div>
                    </div>

                    <div class="teams">
                        <div class="home">
                            <img class="flag" src="flags/${match.homeFlag}.jpg">
                            <span class="team-name">${match.home}</span>
                        </div>

                        <div class="score">${scoreText}</div>

                        <div class="away">
                            <span class="team-name">${match.away}</span>
                            <img class="flag" src="flags/${match.awayFlag}.jpg">
                        </div>
                    </div>
                </div>`;
            }).join("")}
        `;

        container.appendChild(card);
    });
}

/* ===== KNOCKOUT (แก้แค่ “วันที่ + สี + ยังใช้ UI เดิม”) ===== */
function renderKnockout(data){

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(round => {

        const card = document.createElement("div");
        card.className = "card";

        let html = `<div class="card-header">${round.round}</div>`;

        round.days.forEach(day => {

            html += `<div class="knockout-date">${day.date}</div>`;

            day.matches.forEach(match => {

                const homeFlag = flagMap[match.home] || "";
                const awayFlag = flagMap[match.away] || "";

                html += `
                <div class="match">
                    <div class="top-row">
                        <div>${round.round}</div>
                        <div>${match.time}</div>
                    </div>

                    <div class="teams">
                        <div class="home">
                            <img class="flag" src="flags/${homeFlag}.jpg">
                            <span class="team-name">${match.home}</span>
                        </div>

                        <div class="score">-</div>

                        <div class="away">
                            <span class="team-name">${match.away}</span>
                            <img class="flag" src="flags/${awayFlag}.jpg">
                        </div>
                    </div>
                </div>`;
            });
        });

        card.innerHTML = html;
        container.appendChild(card);
    });
}
</script>

</body>
</html>
