<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Cup 2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:12px;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0;
}

/* TABS */
.tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    flex:1;
    padding:10px;
    border-radius:10px;
    text-align:center;
    background:#ddd;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* CONTAINER */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

/* HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px;
    font-weight:bold;
    font-size:14px;
}

/* MATCH */
.match{
    padding:10px;
    border-bottom:1px solid #eee;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#666;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-top:6px;
}

.home,.away{
    display:flex;
    align-items:center;
    gap:6px;
}

.away{justify-content:flex-end;}

.score{
    font-weight:bold;
    text-align:center;
}

.flag{
    width:20px;
    height:14px;
}

/* HIDE */
.hidden{display:none;}

</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" id="tabGroup">Group Stage</div>
    <div class="tab" id="tabKnock">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
  "Canada":"CAN","USA":"USA","Brazil":"BRA","Argentina":"ARG","France":"FRA",
  "England":"ENG","Germany":"GER","Spain":"ESP","Portugal":"POR","Japan":"JPN"
};

let currentTab = "group";

/* ---------- TAB SWITCH ---------- */
document.getElementById("tabGroup").onclick = () => {
    currentTab = "group";
    setActiveTab();
    loadGroup();
};

document.getElementById("tabKnock").onclick = () => {
    currentTab = "knock";
    setActiveTab();
    loadKnockout();
};

function setActiveTab(){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    if(currentTab==="group"){
        document.getElementById("tabGroup").classList.add("active");
    }else{
        document.getElementById("tabKnock").classList.add("active");
    }
}

/* ---------- GROUP STAGE ---------- */
function loadGroup(){

fetch(`matches.json?v=${Date.now()}`)
.then(r=>r.json())
.then(data=>{

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(day=>{

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date}</div>
            ${day.matches.map(m=>{

                const score =
                    (m.homeScore === "-" || m.homeScore==null)
                    ? "-"
                    : `${m.homeScore} - ${m.awayScore}`;

                return `
                <div class="match">
                    <div class="top-row">
                        <div>${m.group}</div>
                        <div>${m.time}</div>
                    </div>

                    <div class="teams">
                        <div class="home">
                            <img class="flag" src="flags/${flagMap[m.home]}.jpg">
                            <span>${m.home}</span>
                        </div>

                        <div class="score">${score}</div>

                        <div class="away">
                            <span>${m.away}</span>
                            <img class="flag" src="flags/${flagMap[m.away]}.jpg">
                        </div>
                    </div>
                </div>
                `;
            }).join("")}
        `;

        container.appendChild(card);
    });

});
}

/* ---------- KNOCKOUT ---------- */
function loadKnockout(){

fetch(`knockout.json?v=${Date.now()}`)
.then(r=>r.json())
.then(data=>{

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(round=>{

        round.days.forEach(day=>{

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-header">
                    ${round.round} • ${day.date}
                </div>

                ${day.matches.map(m=>{

                    const score =
                        (m.homeScore==null)
                        ? "-"
                        : `${m.homeScore} - ${m.awayScore}`;

                    return `
                    <div class="match">
                        <div class="top-row">
                            <div>${round.round}</div>
                            <div>${m.time}</div>
                        </div>

                        <div class="teams">
                            <div class="home">
                                <span>${m.home}</span>
                            </div>

                            <div class="score">${score}</div>

                            <div class="away">
                                <span>${m.away}</span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join("")}
            `;

            container.appendChild(card);
        });

    });

});
}

/* default */
loadGroup();

</script>

</body>
</html>
