<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Cup 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:12px;
}

h1{
    text-align:center;
    font-size:18px;
    margin:10px 0;
}

/* TABS */
.tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    flex:1;
    padding:10px;
    text-align:center;
    background:#ddd;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px;
    font-weight:bold;
    font-size:14px;
}

/* MATCH */
.match{
    padding:10px;
    border-bottom:1px solid #eee;
}

.match:last-child{
    border-bottom:none;
}

/* TOP */
.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#666;
}

/* TEAMS */
.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-top:6px;
}

.home,.away{
    display:flex;
    align-items:center;
    gap:6px;
}

.away{justify-content:flex-end;}

.score{
    font-weight:bold;
    text-align:center;
}

</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" id="tab1">Group Stage</div>
    <div class="tab" id="tab2">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
  "Canada":"CAN","USA":"USA","Brazil":"BRA","Argentina":"ARG",
  "France":"FRA","England":"ENG","Germany":"GER","Spain":"ESP","Portugal":"POR"
};

let mode = "group";

document.getElementById("tab1").onclick = () => {
    mode = "group";
    setTab();
    loadGroup();
};

document.getElementById("tab2").onclick = () => {
    mode = "knock";
    setTab();
    loadKnock();
};

function setTab(){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    if(mode==="group") document.getElementById("tab1").classList.add("active");
    else document.getElementById("tab2").classList.add("active");
}

/* ================= GROUP ================= */
function loadGroup(){

fetch("matches.json")
.then(r=>r.json())
.then(data=>{

    const c = document.getElementById("schedule");
    c.innerHTML = "";

    data.forEach(day=>{

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date}</div>

            ${day.matches.map(m=>{

                const score =
                    (m.homeScore==null || m.homeScore=="-")
                    ? "-"
                    : `${m.homeScore} - ${m.awayScore}`;

                return `
                <div class="match">

                    <div class="top-row">
                        <div>${m.group ?? ""}</div>
                        <div>${m.time}</div>
                    </div>

                    <div class="teams">

                        <div class="home">
                            <span>${m.home}</span>
                        </div>

                        <div class="score">${score}</div>

                        <div class="away">
                            <span>${m.away}</span>
                        </div>

                    </div>

                </div>
                `;
            }).join("")}
        `;

        c.appendChild(card);
    });

});
}

/* ================= KNOCKOUT ================= */
function loadKnock(){

fetch("knockout.json")
.then(r=>r.json())
.then(data=>{

    const c = document.getElementById("schedule");
    c.innerHTML = "";

    data.forEach(round=>{

        round.days.forEach(day=>{

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-header">
                    ${day.date} • ${round.round}
                </div>

                ${day.matches.map(m=>{

                    const score =
                        (m.homeScore==null)
                        ? "-"
                        : `${m.homeScore} - ${m.awayScore}`;

                    return `
                    <div class="match">

                        <div class="top-row">
                            <div></div>
                            <div>${m.time}</div>
                        </div>

                        <div class="teams">

                            <div class="home">
                                <span>${m.home}</span>
                            </div>

                            <div class="score">${score}</div>

                            <div class="away">
                                <span>${m.away}</span>
                            </div>

                        </div>

                    </div>
                    `;
                }).join("")}
            `;

            c.appendChild(card);
        });

    });

});
}

/* default */
loadGroup();

</script>

</body>
</html>
