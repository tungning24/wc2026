<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

#schedule{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(500px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card-header{
    background:#111;
    color:#fff;
    padding:12px 16px;
    font-weight:bold;
}

.match{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid #eee;
}

.match:last-child{
    border-bottom:none;
}

.group{
    width:24px;
    font-weight:bold;
    color:#d32f2f;
    flex-shrink:0;
}

.time{
    width:55px;
    font-weight:bold;
    color:#1976d2;
    flex-shrink:0;
}

.teams{
    flex:1;
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    min-width:0;
}

.home{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-start;
}

.away{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-end;
}

.team-name{
    white-space:nowrap;
}

.score{
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.flag{
    width:24px;
    height:16px;
    object-fit:cover;
    border:1px solid #ddd;
    border-radius:2px;
}

@media(max-width:600px){

    #schedule{
        grid-template-columns:1fr;
    }

    .teams{
        grid-template-columns:1fr 60px 1fr;
    }

}

</style>
</head>
<body>
<script>

if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('./sw.js')
      .then(() => console.log('SW Registered'))
      .catch(err => console.log(err));

  });

}

</script>

<h1>FIFA WORLD CUP 2026</h1>

<div id="schedule"></div>

<script>

const flagMap = {
  "Mexico":"MEX",
  "South Africa":"RSA",
  "South Korea":"KOR",
  "Czechia":"CZE",
  "Canada":"CAN",
  "Bosnia & Herz.":"BIH",
  "Bosnia":"BIH",
  "USA":"USA",
  "Paraguay":"PAR",
  "Qatar":"QAT",
  "Switzerland":"SUI",
  "Brazil":"BRA",
  "Morocco":"MAR",
  "Haiti":"HAI",
  "Scotland":"SCO",
  "Australia":"AUS",
  "Turkiye":"TUR",
  "Germany":"GER",
  "Curacao":"CUW",
  "Netherlands":"NED",
  "Japan":"JPN",
  "Ivory Coast":"CIV",
  "Ecuador":"ECU",
  "Sweden":"SWE",
  "Tunisia":"TUN",
  "Spain":"ESP",
  "Cape Verde":"CPV",
  "Belgium":"BEL",
  "Egypt":"EGY",
  "Saudi Arabia":"KSA",
  "Uruguay":"URU",
  "Iran":"IRN",
  "New Zealand":"NZL",
  "France":"FRA",
  "Senegal":"SEN",
  "Iraq":"IRQ",
  "Norway":"NOR",
  "Argentina":"ARG",
  "Algeria":"ALG",
  "Austria":"AUT",
  "Jordan":"JOR",
  "Portugal":"POR",
  "Congo DR":"COD",
  "England":"ENG",
  "Croatia":"CRO",
  "Ghana":"GHA",
  "Panama":"PAN",
  "Uzbekistan":"UZB",
  "Colombia":"COL"
};

fetch("matches.json")
.then(r => r.json())
.then(data => {

    const container = document.getElementById("schedule");

    data.forEach(day => {

        const card = document.createElement("div");
        card.className = "card";

        day.matches.forEach(match => {

            match.homeFlag ??= flagMap[match.home];
            match.awayFlag ??= flagMap[match.away];

            match.homeScore ??= "-";
            match.awayScore ??= "-";

        });

        card.innerHTML = `
            <div class="card-header">${day.date}</div>

            ${day.matches.map(match => {

                const scoreText =
                    (match.homeScore === "-" && match.awayScore === "-")
                    ? "-"
                    : `${match.homeScore} - ${match.awayScore}`;

                return `
                    <div class="match">

                        <div class="group">${match.group}</div>

                        <div class="time">${match.time}</div>

                        <div class="teams">

                            <div class="home">
                                <img
                                    class="flag"
                                    src="flags/${match.homeFlag}.jpg"
                                    alt="${match.home}"
                                    onerror="this.style.display='none'"
                                >

                                <span class="team-name">
                                    ${match.home}
                                </span>
                            </div>

                            <div class="score">
                                ${scoreText}
                            </div>

                            <div class="away">
                                <span class="team-name">
                                    ${match.away}
                                </span>

                                <img
                                    class="flag"
                                    src="flags/${match.awayFlag}.jpg"
                                    alt="${match.away}"
                                    onerror="this.style.display='none'"
                                >
                            </div>

                        </div>

                    </div>
                `;
            }).join("")}

        `;

        container.appendChild(card);

    });

})
.catch(console.error);

</script>

</body>
</html>
