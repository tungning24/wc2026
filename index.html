<script>
let groupData = [];
let knockoutData = [];
let currentTab = "group";

fetch("matches.json")
.then(r => r.json())
.then(data => {
    groupData = data;
    if (currentTab === "group") render(groupData);
});

fetch("knockout.json")
.then(r => r.json())
.then(data => {
    knockoutData = data;
});

function switchTab(tab, e){
    currentTab = tab;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    e.target.classList.add("active");

    if(tab === "group"){
        render(groupData);
    } else {
        renderKnockout(knockoutData);
    }
}

/* ===== GROUP (เดิม 100%) ===== */
function render(data){

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(day => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date}</div>

            ${day.matches.map(match => {

                return `
                <div class="match">

                    <div class="top-row">
                        <div>${match.group || ""}</div>
                        <div>${match.time}</div>
                    </div>

                    <div class="teams">

                        <div class="home">
                            <span class="team-name">${match.home}</span>
                        </div>

                        <div class="score">-</div>

                        <div class="away">
                            <span class="team-name">${match.away}</span>
                        </div>

                    </div>

                </div>`;
            }).join("")}
        `;

        container.appendChild(card);
    });
}

/* ===== KNOCKOUT (แค่แปลงให้เข้ารูป group) ===== */
function renderKnockout(data){

    const normalized = [];

    data.forEach(round => {
        round.days.forEach(day => {
            normalized.push({
                date: day.date,
                matches: day.matches.map(m => ({
                    ...m,
                    group: round.round
                }))
            });
        });
    });

    render(normalized);
}
</script>
