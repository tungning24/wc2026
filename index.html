<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 10px;
    color:#111827;
}

/* TABS */
.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    padding:6px 10px;
    border:none;
    border-radius:8px;
    background:#e5e7eb;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* MAIN GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* DATE HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* MATCH BLOCK */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

/* TOP ROW */
.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

/* TEAMS */
.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* SCORE */
.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

/* FLAG */
.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

/* RESPONSIVE */
@media(min-width:600px){
    #schedule{ grid-template-columns:1fr 1fr; }
}

@media(min-width:1000px){
    #schedule{ grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
  <button class="tab active" onclick="switchTab('group')">Group Stage</button>
  <button class="tab" onclick="switchTab('knockout')">Knockout</button>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
  "Canada":"CAN","Bosnia & Herz.":"BIH","Bosnia":"BIH","USA":"USA",
  "Paraguay":"PAR","Qatar":"QAT","Switzerland":"SUI","Brazil":"BRA",
  "Morocco":"MAR","Haiti":"HAI","Scotland":"SCO","Australia":"AUS",
  "Turkiye":"TUR","Germany":"GER","Curacao":"CUW","Netherlands":"NED",
  "Japan":"JPN","Ivory Coast":"CIV","Ecuador":"ECU","Sweden":"SWE",
  "Tunisia":"TUN","Spain":"ESP","Cape Verde":"CPV","Belgium":"BEL",
  "Egypt":"EGY","Saudi Arabia":"KSA","Uruguay":"URU","Iran":"IRN",
  "New Zealand":"NZL","France":"FRA","Senegal":"SEN","Iraq":"IRQ",
  "Norway":"NOR","Argentina":"ARG","Algeria":"ALG","Austria":"AUT",
  "Jordan":"JOR","Portugal":"POR","Congo DR":"COD","England":"ENG",
  "Croatia":"CRO","Ghana":"GHA","Panama":"PAN","Uzbekistan":"UZB",
  "Colombia":"COL"
};

let groupData = [];
let knockoutData = [];
let currentTab = "group";

fetch(`matches.json?v=${Date.now()}`)
.then(r => r.json())
.then(data => {
    groupData = data;
    render(groupData);
});

fetch(`knockout.json?v=${Date.now()}`)
.then(r => r.json())
.then(data => {
    knockoutData = data;
});

function switchTab(tab){
    currentTab = tab;

    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");

    if(tab === "group"){
        render(groupData);
    } else {
        render(knockoutData);
    }
}

function render(data){

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(day => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date || day.round}</div>

            ${day.matches.map(match => {

                const home = match.home || match.team1;
                const away = match.away || match.team2;

                const homeScore = match.homeScore ?? "-";
                const awayScore = match.awayScore ?? "-";

                const scoreText =
                    (homeScore === "-" && awayScore === "-")
                    ? "-"
                    : `${homeScore} - ${awayScore}`;

                const homeFlag = flagMap[home];
                const awayFlag = flagMap[away];

                return `
                <div class="match">

                    <div class="top-row">
                        <div>${match.group || match.round || ""}</div>
                        <div>${match.time || ""}</div>
                    </div>

                    <div class="teams">

                        <div class="home">
                            <img class="flag"
                                src="flags/${homeFlag}.jpg"
                                onerror="this.style.display='none'">
                            <span class="team-name">${home}</span>
                        </div>

                        <div class="score">${scoreText}</div>

                        <div class="away">
                            <span class="team-name">${away}</span>
                            <img class="flag"
                                src="flags/${awayFlag}.jpg"
                                onerror="this.style.display='none'">
                        </div>

                    </div>

                </div>
                `;
            }).join("")}
        `;

        container.appendChild(card);
    });
}
</script>

</body>
</html>
