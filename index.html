<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>World Cup 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f5f7;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

#schedule{
    display:grid;
    gap:20px;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.card-header{
    background:#111;
    color:#fff;
    padding:12px 16px;
    font-weight:bold;
}

.match{
    display:grid;
    grid-template-columns:40px 1fr 70px 1fr;
    gap:10px;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid #eee;
}

.match:last-child{
    border-bottom:none;
}

.group{
    font-weight:bold;
    color:#d32f2f;
}

.time{
    text-align:center;
    font-weight:bold;
    color:#1976d2;
}

.away{
    text-align:right;
}

</style>

</head>
<body>

<h1>FIFA WORLD CUP 2026</h1>

<div id="schedule"></div>

<script>

fetch("matches.json")
.then(r => r.json())
.then(data => {

    const container = document.getElementById("schedule");

    data.forEach(day => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date}</div>
            ${day.matches.map(match => `
                <div class="match">
                    <div class="group">${match.group}</div>
                    <div>${match.home}</div>
                    <div class="time">${match.time}</div>
                    <div class="away">${match.away}</div>
                </div>
            `).join("")}
        `;

        container.appendChild(card);

    });

});

</script>

</body>
</html>
