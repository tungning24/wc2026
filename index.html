<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 10px;
    color:#111827;
}

/* TAB */
.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* MAIN GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD (เดิม 100%) */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* DATE HEADER (group) */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* KNOCKOUT DATE BAR (เพิ่มใหม่อย่างเดียว) */
.k-date{
    background:#2563eb;
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    font-weight:bold;
}

/* MATCH */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

/* TEAMS */
.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

@media(min-width:600px){
    #schedule{ grid-template-columns:1fr 1fr; }
}
@media(min-width:1000px){
    #schedule{ grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab('group')">Group Stage</div>
    <div class="tab" onclick="switchTab('knockout')">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
  "Canada":"CAN","USA":"USA","Brazil":"BRA","Argentina":"ARG","France":"FRA"
};

let groupData=[], knockoutData=[];
let currentTab="group";

fetch("matches.json?v="+Date.now())
.then(r=>r.json())
.then(d=>{
    groupData=d;
    if(currentTab==="group") renderGroup();
});

fetch("knockout.json?v="+Date.now())
.then(r=>r.json())
.then(d=>{
    knockoutData=d;
});

/* TAB */
function switchTab(tab){
    currentTab=tab;

    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    event.target.classList.add("active");

    if(tab==="group") renderGroup();
    else renderKnockout();
}

/* GROUP (เหมือนเดิม) */
function renderGroup(){
    const c=document.getElementById("schedule");
    c.innerHTML="";

    groupData.forEach(day=>{
        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
        <div class="card-header">${day.date}</div>
        ${day.matches.map(m=>{
            const score=(m.homeScore??"-")+" - "+(m.awayScore??"-");

            return `
            <div class="match">
                <div class="top-row">
                    <div>${m.group}</div>
                    <div>${m.time}</div>
                </div>

                <div class="teams">
                    <div class="home">
                        <span class="team-name">${m.home}</span>
                    </div>

                    <div class="score">${score}</div>

                    <div class="away">
                        <span class="team-name">${m.away}</span>
                    </div>
                </div>
            </div>`;
        }).join("")}
        `;

        c.appendChild(card);
    });
}

/* KNOCKOUT (เพิ่มสีแยกวันเฉย ๆ) */
function renderKnockout(){
    const c=document.getElementById("schedule");
    c.innerHTML="";

    knockoutData.forEach(round=>{

        const card=document.createElement("div");
        card.className="card";

        let html=`<div class="card-header">${round.round}</div>`;

        round.days.forEach(day=>{

            html+=`<div class="k-date">${day.date}</div>`;

            day.matches.forEach(m=>{
                html+=`
                <div class="match">
                    <div class="top-row">
                        <div>${round.round}</div>
                        <div>${m.time}</div>
                    </div>

                    <div class="teams">
                        <div class="home">
                            <span class="team-name">${m.home}</span>
                        </div>

                        <div class="score">-</div>

                        <div class="away">
                            <span class="team-name">${m.away}</span>
                        </div>
                    </div>
                </div>`;
            });
        });

        card.innerHTML=html;
        c.appendChild(card);
    });
}
</script>

</body>
</html>
