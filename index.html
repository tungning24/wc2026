<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

/* HEADER */
h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 16px;
    color:#111827;
}

/* TABS */
.tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    flex:1;
    padding:10px;
    text-align:center;
    border-radius:10px;
    background:#ddd;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* MAIN GRID */
#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* DATE HEADER */
.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

/* MATCH BLOCK */
.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

/* TOP ROW */
.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

/* TEAMS LAYOUT */
.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

/* TEAM SIDE */
.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

/* NAME */
.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* SCORE */
.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

/* FLAG */
.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" id="tabGroup">Group Stage</div>
    <div class="tab" id="tabKnock">Knockout</div>
</div>

<div id="schedule"></div>

<script>
const flagMap = {
  "Mexico":"MEX","South Africa":"RSA","South Korea":"KOR","Czechia":"CZE",
  "Canada":"CAN","USA":"USA","Brazil":"BRA","Argentina":"ARG",
  "France":"FRA","England":"ENG","Germany":"GER","Spain":"ESP","Portugal":"POR",
  "Japan":"JPN"
};

let mode = "group";

/* TAB SWITCH */
document.getElementById("tabGroup").onclick = () => {
    mode = "group";
    setTab();
    loadGroup();
};

document.getElementById("tabKnock").onclick = () => {
    mode = "knock";
    setTab();
    loadKnock();
};

function setTab(){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    if(mode==="group") document.getElementById("tabGroup").classList.add("active");
    else document.getElementById("tabKnock").classList.add("active");
}

/* ================= GROUP (UI เดิม 100%) ================= */
function loadGroup(){

fetch(`matches.json?v=${Date.now()}`)
.then(r=>r.json())
.then(data=>{

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(day=>{

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">${day.date}</div>

            ${day.matches.map(match=>{

                const scoreText =
                    (match.homeScore == null || match.homeScore === "-")
                    ? "-"
                    : `${match.homeScore} - ${match.awayScore}`;

                return `
                    <div class="match">

                        <div class="top-row">
                            <div>${match.group}</div>
                            <div>${match.time}</div>
                        </div>

                        <div class="teams">

                            <div class="home">
                                <img class="flag"
                                    src="flags/${flagMap[match.home]}.jpg"
                                    onerror="this.style.display='none'">
                                <span class="team-name">${match.home}</span>
                            </div>

                            <div class="score">${scoreText}</div>

                            <div class="away">
                                <span class="team-name">${match.away}</span>
                                <img class="flag"
                                    src="flags/${flagMap[match.away]}.jpg"
                                    onerror="this.style.display='none'">
                            </div>

                        </div>

                    </div>
                `;
            }).join("")}
        `;

        container.appendChild(card);
    });

});
}

/* ================= KNOCKOUT (ใช้ UI เดิม 100%) ================= */
function loadKnock(){

fetch(`knockout.json?v=${Date.now()}`)
.then(r=>r.json())
.then(data=>{

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    data.forEach(round=>{

        round.days.forEach(day=>{

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-header">
                    ${day.date} • ${round.round}
                </div>

                ${day.matches.map(match=>{

                    const scoreText =
                        (match.homeScore == null)
                        ? "-"
                        : `${match.homeScore} - ${match.awayScore}`;

                    return `
                        <div class="match">

                            <div class="top-row">
                                <div>${round.round}</div>
                                <div>${match.time}</div>
                            </div>

                            <div class="teams">

                                <div class="home">
                                    <span class="team-name">${match.home}</span>
                                </div>

                                <div class="score">${scoreText}</div>

                                <div class="away">
                                    <span class="team-name">${match.away}</span>
                                </div>

                            </div>

                        </div>
                    `;
                }).join("")}
            `;

            container.appendChild(card);
        });

    });

});
}

/* default */
loadGroup();

</script>

</body>
</html>
