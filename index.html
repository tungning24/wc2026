<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

.match{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid #eee;
}

.group{
    width:24px;
    font-weight:bold;
    color:#d32f2f;
    flex-shrink:0;
}

.time{
    width:55px;
    font-weight:bold;
    color:#1976d2;
    flex-shrink:0;
}

.teams{
    flex:1;
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    min-width:0;
}

.home{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-start;
    min-width:0;
}

.away{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-end;
    min-width:0;
}

.score{
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.flag{
    width:24px;
    height:16px;
    object-fit:cover;
    border:1px solid #ddd;
    border-radius:2px;
}

.team-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

</style>
</head>
<body>

<div class="match">

    <div class="group">A</div>

    <div class="time">02:00</div>

    <div class="teams">

        <div class="home">
            <img class="flag" src="flags/MEX.jpg">
            <span class="team-name">Mexico</span>
        </div>

        <div class="score">
            2 - 1
        </div>

        <div class="away">
            <span class="team-name">South Africa</span>
            <img class="flag" src="flags/RSA.jpg">
        </div>

    </div>

</div>

</body>
</html>
