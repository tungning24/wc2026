<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

h1{
    text-align:center;
    font-size:18px;
    margin:10px 0 10px;
    color:#111827;
}

.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

.knockout-date{
    background:#4c5563;
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    font-weight:bold;
}

.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.match:last-child{
    border-bottom:none;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

.home, .away{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.home{ justify-content:flex-start; }
.away{ justify-content:flex-end; }

.team-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    color:#111827;
}

.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

.tv-icon{
    width:14px;
    height:14px;
    margin-left:4px;
    vertical-align:middle;
}

@media(min-width:600px){
    #schedule{ grid-template-columns:1fr 1fr; }
}
@media(min-width:1000px){
    #schedule{ grid-template-columns:1fr 1fr 1fr; }
}
/* card table ของ standings เท่านั้น */
.card table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

/* header แถวบน */
.card th{
    background:#4c5563;
    color:#fff;
    padding:6px 4px;
    font-size:12px;
}

/* ช่องข้อมูล */
.card td{
    padding:6px 4px;
    font-size:12px;
    text-align:center;
}

/* ทีม (คอลัมน์แรก) */
.card td:first-child{
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* flag */
.card td img{
    width:18px;
    height:12px;
    vertical-align:middle;
    margin-right:6px;
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab('group', event)">Group Stage</div>
    <div class="tab" onclick="switchTab('standings', event)">Standings</div>
    <div class="tab" onclick="switchTab('knockout', event)">Knockout</div>
</div>

<div id="schedule"></div>

<script src="main.js"></script>

</body>
</html>
