<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Cup 2026</title>

<style>
body{
  font-family: Arial;
  background:#f3f4f6;
  margin:0;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  padding:6px 12px;
  background:#e5e7eb;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.tab.active{
  background:#111827;
  color:#fff;
}

#app{
  display:grid;
  gap:12px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.card-header{
  background:#111827;
  color:#fff;
  padding:10px;
  font-weight:bold;
}

.match, .team-row{
  padding:10px;
  border-bottom:1px solid #eee;
}

.match:last-child,
.team-row:last-child{
  border-bottom:none;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}

.score{
  font-weight:bold;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th, .table td{
  padding:6px;
  font-size:13px;
  border-bottom:1px solid #eee;
  text-align:center;
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
  <div class="tab active" onclick="switchTab('matches', event)">Matches</div>
  <div class="tab" onclick="switchTab('standings', event)">Standings</div>
  <div class="tab" onclick="switchTab('knockout', event)">Knockout</div>
</div>

<div id="app"></div>

<script src="standings.js"></script>
<script src="main.js"></script>

</body>
</html>
