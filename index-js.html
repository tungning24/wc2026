<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>FIFA WORLD CUP 2026</title>

<style>
/* ===== UI เดิมคุณ 100% ===== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    overflow-x:hidden;
}

h1{
    text-align:center;
    font-size:18px;
    margin:10px 0;
    color:#111827;
}

.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
}

.tab{
    padding:6px 12px;
    background:#e5e7eb;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.tab.active{
    background:#111827;
    color:#fff;
}

#schedule{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card-header{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    font-weight:bold;
    font-size:14px;
}

.knockout-date{
    background:#374151;
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    font-weight:bold;
}

.match{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.top-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
}

.teams{
    display:grid;
    grid-template-columns:1fr 70px 1fr;
    align-items:center;
    gap:6px;
}

.home,.away{
    display:flex;
    align-items:center;
    gap:6px;
}

.score{
    width:70px;
    text-align:center;
    font-weight:bold;
}

.flag{
    width:22px;
    height:15px;
    object-fit:cover;
    border:1px solid #ddd;
    border-radius:2px;
}
</style>
</head>

<body>

<h1>FIFA WORLD CUP 2026</h1>

<div class="tabs">
  <div class="tab active" onclick="switchTab('group', event)">Group</div>
  <div class="tab" onclick="switchTab('standings', event)">Standings</div>
  <div class="tab" onclick="switchTab('knockout', event)">Knockout</div>
</div>

<div id="schedule"></div>

<script src="standings.js"></script>
<script src="main.js"></script>

</body>
</html>
